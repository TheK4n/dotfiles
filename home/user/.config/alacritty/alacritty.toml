[general]
live_config_reload = true
import = [
    "config.d/size.toml",
]

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[font.normal]
family = "FiraCode Nerd Font Mono"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "None"
key = "Space"
mods = "Control|Shift"

[mouse]
hide_when_typing = true

[scrolling]
history = 1000
multiplier = 3

[window]
dynamic_title = true
opacity = 0.6

[window.dimensions]
columns = 150
lines = 42
