[mgr]
sort_by = "natural"
sort_dir_first = false
linemode = "size_and_mtime"
show_symlink = true

[preview]
wrap = "no"
tab_size = 4


[opener]
play = [
	{ run = "mpv %s", orphan = true, for = "unix" },
]
edit = [
	{ run = "cd \"${YAZI_ORIGINAL_CWD:-${PWD}}\" && ${EDITOR} %s", block = true, for = "unix" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open" },
]
